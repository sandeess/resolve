[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart>=0.0.27,<1.0.0",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "pydantic>=2.13.5",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic>=1.19.1,<2.0.0",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "sqlmodel>=0.0.46,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.70.0,<3.0.0",
    "pyjwt[crypto]>=2.15.0,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pgvector>=0.5.1",
    "openai>=3.46.0",
    "langgraph>=1.2.20",
    "procrastinate[psycopg]>=3.10.0",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "fastmcp>=4.1.6",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.16.0",
    "coverage<8.0.0,>=7.4.3",
    "testcontainers[postgres]>=4.15.0",
    "httpx>=0.28.1",
    "pip-licenses>=5.5.5",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "pgvector.*", "corpus", "metrics", "harness", "run_eval", "check_licenses"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
"../eval/run_eval.py" = ["T201"]  # a CLI prints its report

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
pythonpath = [".", "../eval"]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true

[tool.fastapi]
entrypoint = "app.main:app"
